      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_nougght_monitoring-system_server_internal_transport_dto_types.AgentConfigResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gin.H'
        "500":
