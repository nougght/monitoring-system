basePath: /api/v1
definitions:
  Agent:
    properties:
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      isOnline:
        type: boolean
      lastSeenAt:
        type: string
      name:
        type: string
      status:
        type: string
    type: object
  AgentConfigBody:
    properties:
      enrollmentKey:
        type: string
    type: object
  AgentConfigResponse:
    properties:
      enrollmentAddress:
        type: string
      enrollmentKey:
        type: string
      serverAddress:
        type: string
    type: object
  CreateAgentBody:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  CreateAgentResponse:
    properties:
      createdAt:
        type: string
      description:
        type: string
      enrollmentKey:
        type: string
      id:
        type: string
      isOnline:
        type: boolean
      lastSeenAt:
        type: string
      name:
        type: string
      status:
        type: string
    type: object
host: localhost:8091
info:
  contact: {}
  title: Monitoring Server API
  version: "1.0"
paths:
  /agents:
    get:
      operationId: getAllAgents
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Agent'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all agents
    post:
      consumes:
      - application/json
      operationId: createAgent
      parameters:
      - description: Create agent body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateAgentBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CreateAgentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create new agent
  /agents/{agentID}/setupconfig:
    post:
      consumes:
      - application/json
      operationId: downloadAgentConfig
      parameters:
      - description: Agent ID
        in: path
        name: agentID
        required: true
        type: string
      - description: Download agent config body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/AgentConfigBody'
      produces:
      - application/x-yaml
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AgentConfigResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Download agent setup config
swagger: "2.0"
