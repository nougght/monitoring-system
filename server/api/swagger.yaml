    post:
      consumes:
      - application/json
      parameters:
      - description: Agent ID
        in: path
        name: agentID
        required: true
        type: string
      - description: Download agent config body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_nougght_monitoring-system_server_internal_transport_dto_types.AgentConfigBody'
